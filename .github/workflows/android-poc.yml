name: Android WebView PoC

on:
  push:
    paths:
      - 'android-poc/**'
      - '.github/workflows/android-poc.yml'
  pull_request:
    paths:
      - 'android-poc/**'
      - '.github/workflows/android-poc.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: xhs-webview-poc-debug
          path: android-poc/app/build/outputs/apk/debug/app-debug.apk
